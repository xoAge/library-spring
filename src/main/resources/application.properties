spring.application.name=library-spring

spring.datasource.url=jdbc:postgresql://localhost:5432/library_spring
spring.datasource.username=library_app
#взять из переменной окружения пароль
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5

# Hibernate проверяет схему, создаёт её Flyway
spring.jpa.hibernate.ddl-auto=validate

# показывать SQL, который генерирует Hibernate - для учебы
spring.jpa.show-sql=true

# не больше 100 элементов на странице, даже если клиент попросит больше
spring.data.web.pageable.max-page-size=100