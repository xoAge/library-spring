services:

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: library_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: library_spring
    ports:
      - "15432:5432"
    volumes:
      - library-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_app -d library_spring"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/library_spring
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  library-data: